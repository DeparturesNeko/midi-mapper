# ============================================
# MIDI Mapper v1.1 映射配置文件
# ============================================
# 使用 monitor 命令查看实时MIDI消息，确定音符号和CC号
# 然后在此文件中配置映射规则
#
# 支持的动作:
#   键盘: KEY_A ~ KEY_Z, KEY_0 ~ KEY_9, KEY_F1 ~ KEY_F12
#         KEY_SPACE, KEY_ENTER, KEY_ESC, KEY_TAB, KEY_BACKSPACE
#         KEY_UP, KEY_DOWN, KEY_LEFT, KEY_RIGHT
#         KEY_SHIFT, KEY_CTRL, KEY_ALT
#         KEY_DELETE, KEY_INSERT, KEY_HOME, KEY_END
#         KEY_PAGEUP, KEY_PAGEDOWN
#   组合键: KEY_CTRL+KEY_C, KEY_CTRL+KEY_V, KEY_ALT+KEY_TAB 等
#   鼠标: MOUSE_LEFT, MOUSE_RIGHT, MOUSE_MIDDLE
#   鼠标移动: MOUSE_MOVE_X, MOUSE_MOVE_Y (仅用于CC映射)
#   鼠标滚轮: MOUSE_SCROLL (仅用于CC映射)

[NoteMap]
# 音符号 = 动作
# 使用 monitor 命令查看你的MIDI设备发送的音符号
#
# 示例 (根据你的MIDI设备修改):
60 = KEY_A
62 = KEY_S
64 = KEY_D
65 = KEY_F
67 = KEY_G
69 = KEY_H
71 = KEY_J
72 = KEY_K
36 = MOUSE_LEFT
38 = MOUSE_RIGHT
48 = KEY_SPACE
50 = KEY_ENTER
52 = KEY_CTRL+KEY_C
53 = KEY_CTRL+KEY_V

[CCMap]
# CC控制器号 = 动作
# 对于 MOUSE_MOVE_X/Y: CC值变化量转换为鼠标移动
# 对于 MOUSE_SCROLL: CC值变化量转换为滚轮滚动
# 对于键盘按键: CC>=64 按下, CC<64 释放 (适合踏板等开关)
#
1 = MOUSE_MOVE_Y
7 = MOUSE_MOVE_X
10 = MOUSE_SCROLL
64 = KEY_SPACE

[CCNames]
# 自定义CC名称 (用于monitor显示，方便识别你的设备)
# CC号 = 自定义名称
# 如果未定义，将显示MIDI标准参考名称
#
# 示例 (电子鼓):
# 4 = Hi-Hat Pedal
#
# 示例 (DJ控制器):
# 16 = EQ High
# 17 = EQ Mid
# 18 = EQ Low
# 19 = Crossfader

[Settings]
# 鼠标移动灵敏度 (1-100, 默认30)
mouse_sensitivity = 30

# CC死区 - CC值变化小于此值时忽略 (0-10, 默认2)
cc_deadzone = 2

# Note触发模式:
#   hold   = 按住直到NoteOff (适合钢琴键盘等持续按住的设备)
#   toggle = 按一次开，再按一次关 (适合打击垫切换状态)
#   tap    = 按下后自动释放 (适合电子鼓等瞬间触发的设备)
note_mode = hold

# tap模式下的按键持续时间 (毫秒, 默认50)
tap_duration = 50
